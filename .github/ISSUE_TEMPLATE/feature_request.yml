name: Feature request
description: Suggest an idea or improvement for Manim Studio.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion. Please describe the problem first, then the idea.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The workflow or limitation behind the request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Mockups and examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Code editor
        - Preview / rendering
        - Timeline / scrubbing
        - Export / stills
        - Live shell
        - CLI / agent workflow
        - Packaging / install
        - Docs
        - Other
    validations:
      required: false
