name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build windows artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Sync environment
        run: uv sync --all-groups

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $version = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ($version -ne $tag) {
            throw "Tag v$tag does not match pyproject version $version"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      # -SkipTests: CI already runs the suite; this still runs ruff + mypy.
      - name: Build bundle, portable zip and installer
        shell: pwsh
        run: ./scripts/build.ps1 -SkipTests

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ManimStudio-*-portable.zip
            dist/ManimStudio-Setup-*.exe
          generate_release_notes: true
          draft: false
