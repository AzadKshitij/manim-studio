[project]
name = "manim-studio"
version = "1.1.0"
description = "Production-grade realtime editor for ManimGL scenes: live preview, timeline, export."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Manim Studio Team" }]
keywords = ["manim", "manimgl", "editor", "animation", "realtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6==6.11.2",
    "pyside6-scintilla==5.6.3.7",
    "manimgl==1.7.2",
    "moderngl==5.13.0",
    "moderngl-window==3.1.1",
    "IPython>=8.18",
    # Pygments lexers drive the code editor's syntax highlighting and its
    # colour themes (see manim_studio.python_highlight).
    "pygments>=2.19",
    # Jedi powers the editor's static completion and calltips off the GUI
    # thread (see manim_studio.python_completion).
    "jedi>=0.20.1",
    # Frame codec for the preview stream: zstd encodes ~6x faster than zlib at a
    # ~3x better ratio (docs/perf). manim_studio.frame_codec imports it lazily
    # and falls back to zlib when it is unavailable.
    "zstandard>=0.23",
    # manimgl 1.7.2 imports pkg_resources at import time. setuptools>=81 no
    # longer ships it, so keep the runtime dependency bounded.
    "setuptools>=84.0.0,<85",
    # pydub (manimgl dependency) needs audioop, removed from stdlib in 3.13.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
    # Single-pass filmstrip crawl suspends construct() at block boundaries without
    # leaving the GL thread (see manim_studio.scrub.ScrubEngine.stream_frames).
    "greenlet>=3.1",
]

[project.urls]
Homepage = "https://github.com/AzadKshitij/manim-studio"
Repository = "https://github.com/AzadKshitij/manim-studio"
Issues = "https://github.com/AzadKshitij/manim-studio/issues"
Changelog = "https://github.com/AzadKshitij/manim-studio/blob/main/CHANGELOG.md"

[project.scripts]
manim-studio = "manim_studio.cli:main"
manim-studio-gui = "manim_studio.cli:gui_main"
manim-studio-preview = "manim_studio.preview_host:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "pytest-cov>=6.1",
    "ruff>=0.17.1",
    "mypy>=1.15",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_studio"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/scenes/*" = ["F841"]            # scene files may keep unused demo locals
"tests/*" = ["B011", "SIM117"]          # test ergonomics

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
markers = [
    "gl: test requires a real OpenGL context (skipped when unavailable)",
    "manim: test requires a working manimgl runtime",
    "slow: slow integration test",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyglet.*",
]

[tool.coverage.run]
source = ["manim_studio"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
files = ["src/manim_studio"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["^tests/"]
