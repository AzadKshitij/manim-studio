[project]
name = "manim-editor"
version = "0.1.0"
description = "Production-grade realtime editor for ManimGL scenes: live preview, timeline, export."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Manim Editor Team" }]
keywords = ["manim", "manimgl", "editor", "animation", "realtime"]
dependencies = [
    "PySide6==6.11.2",
    "pyside6-scintilla==5.6.3.7",
    "manimgl==1.7.2",
    "moderngl==5.12.0",
    "moderngl-window==3.1.1",
    "IPython>=8.18",
    # Pygments lexers drive the code editor's syntax highlighting and its
    # colour themes (see manim_editor.python_highlight).
    "pygments>=2.19",
    # Jedi powers the editor's static completion and calltips off the GUI
    # thread (see manim_editor.python_completion).
    "jedi>=0.19",
    # manimgl 1.7.2 imports pkg_resources at import time. setuptools>=81 no
    # longer ships it, so keep the runtime dependency bounded.
    "setuptools>=69,<81",
    # pydub (manimgl dependency) needs audioop, removed from stdlib in 3.13.
    "audioop-lts>=0.2.2; python_version >= '3.13'",
]

[project.scripts]
manim-editor = "manim_editor.cli:main"
manim-editor-gui = "manim_editor.cli:gui_main"
manim-editor-preview = "manim_editor.preview_host:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-qt>=4.4",
    "pytest-cov>=6.1",
    "ruff>=0.11",
    "mypy>=1.15",
    "pyinstaller>=6.22.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manim_editor"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/scenes/*" = ["F841"]            # scene files may keep unused demo locals
"tests/*" = ["B011", "SIM117"]          # test ergonomics

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
qt_api = "pyside6"
markers = [
    "gl: test requires a real OpenGL context (skipped when unavailable)",
    "manim: test requires a working manimgl runtime",
    "slow: slow integration test",
]
filterwarnings = [
    "ignore::DeprecationWarning:pyglet.*",
]

[tool.coverage.run]
source = ["manim_editor"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.13"
files = ["src/manim_editor"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["^tests/"]
